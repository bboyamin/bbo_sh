version: '3.8'

services:
  local-issue-notifier:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: local_issue_notifier_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./LocalIssueNotifier/data:/app/LocalIssueNotifier/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
